name: Public CTA Registry

on:
  pull_request:
    paths:
      - "src/platform/public-cta-registry.ts"
      - "scripts/verify-public-cta-registry.mjs"
      - ".github/workflows/public-cta-registry.yml"
  push:
    branches: [main]
    paths:
      - "src/platform/public-cta-registry.ts"
      - "scripts/verify-public-cta-registry.mjs"
      - ".github/workflows/public-cta-registry.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify approved public CTA registry
        run: node scripts/verify-public-cta-registry.mjs
