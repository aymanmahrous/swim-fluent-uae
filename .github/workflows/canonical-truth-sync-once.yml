Status: `CANONICAL_TRUTH_SYNCHRONIZED_STALE_PRS_CONTROLLED_REVIEW_READY`

This checkpoint preserves all earlier historical receipts. Where an earlier operational statement conflicts with this checkpoint, this latest verified checkpoint controls.

