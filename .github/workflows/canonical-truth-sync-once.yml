    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/master-baseline-critical-risk-20260730
          fetch-depth: 0

      - name: Synchronize canonical documents
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          handoff = Path('PROJECT_HANDOFF.md')
          h = handoff.read_text(encoding='utf-8')
          marker = '## 29. Canonical truth synchronization and stale PR disposition — 2026-07-30'
          if marker not in h:
              h += r'''


