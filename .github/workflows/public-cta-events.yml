name: Public CTA Events

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-cta-events-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify public CTA event contracts and deduplication
        run: node scripts/verify-public-cta-events.mjs
      - name: Verify consent-gated WhatsApp GA4 runtime
        run: node scripts/verify-whatsapp-ga4-runtime.mjs
