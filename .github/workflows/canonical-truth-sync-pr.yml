name: Canonical truth sync PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'agent/master-baseline-critical-risk-20260730';

            async function read(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              return { text: Buffer.from(r.data.content, 'base64').toString('utf8'), sha: r.data.sha };
            }
            async function write(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, message, sha,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }
            async function remove(path, message) {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                await github.rest.repos.deleteFile({ owner, repo, path, branch, message, sha: r.data.sha });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            const handoffMarker = '## 29. Canonical truth synchronization and stale PR disposition — 2026-07-30';
            const handoffAppend = `\n\n\n## 29. Canonical truth synchronization and stale PR disposition — 2026-07-30\n\nStatus: \`CANONICAL_TRUTH_SYNCHRONIZED_STALE_PRS_CONTROLLED_REVIEW_READY\`\n\nThis checkpoint preserves all earlier historical receipts. Where an earlier operational statement conflicts with this checkpoint, this latest verified checkpoint controls.\n\n### PR #219 — isolated OS RBAC scope\n\n- PR #219 was squash merged at \`866327f82f24e1f300aa7cf134b727fd6e0ec9a1\`.\n- Exact migration source: \`supabase/migrations/20260729221600_restrict_os_rbac_sanitize_errors.sql\`.\n- Supabase Production migration record: \`20260730065949_restrict_os_rbac_sanitize_errors\` on canonical project \`nmzxrjdxvmmzzmajrskm\`.\n- The approved isolated behavior is applied: \`content_manager\` is removed from the two OS staff RPC allowlists; \`super_admin\`, \`admin\`, \`reception\`, and temporary \`coach\` remain; coach-visible raw background-job errors are sanitized to \`JOB_FAILED\`.\n- Grants remain denied to \`anon\`/\`PUBLIC\` and retained for \`authenticated\` and \`service_role\`; both functions remain \`SECURITY DEFINER\` with fixed \`search_path = public, pg_temp\`.\n- Read-only runtime verification passed for the available active \`super_admin\` identity and random non-staff denial: \`RUNTIME_SUPER_ADMIN_AND_NONSTAFF_DENIAL_PASS\`.\n- No active \`admin\`, \`reception\`, \`coach\`, or \`content_manager\` test identities and no current errored background job existed, so the full live role matrix was not fabricated. Those absent-role behaviors remain definition/contract/CI verified rather than live-identity verified.\n- Rollback was not required.\n- Receipt: \`docs/security/PR_219_PRODUCTION_MIGRATION_RECEIPT_2026-07-30.md\`.\n- This closes only PR #219's two-function scope. Broader Phase 3 Security Advisor review, authenticated privileged-function semantics, leaked-password protection, extension placement, RLS-without-policy notices, and other independent findings remain open and must not be bulk-fixed.\n\n### PWA device and technical gate\n\n- Current candidate remains Draft PR #213.\n- Device result: \`PWA_DEVICE_GATE_OWNER_ATTESTED_PASS_DOCUMENTATION_RISK_ACCEPTED\`.\n- Manual-device record: \`OWNER_WITNESSED_MANUAL_DEVICE_TEST_PASS\`.\n- Evidence level: \`OWNER_ATTESTATION_ONLY_NO_SCREENSHOT_RECEIPT\`.\n- The owner attests witnessing Android and iPhone install, Home Screen launch, standalone behavior, expected name/icon/start URL, close/reopen behavior, approved public offline fallback, private-route cache exclusion, and absence of false offline booking success.\n- No Android screenshot or screen recording was retained because the device belonged to a third party. Do not describe this as screenshot verified, screen-recording verified, Independent QA verified, or automated-device verified.\n- Residual documentation risk was accepted by the owner.\n- Device attestation does not authorize Merge or Production Promotion.\n- PR #213 remains behind current \`main\`; current-main synchronization/rebase strategy, fresh GitHub CI, exact-head Preview review, privacy-safe cache checks, offline checks, and rollback re-verification remain pending and separate.\n\n### Stale PR disposition\n\n- PR #218 was reviewed and closed without merge as \`SUPERSEDED_BY_PR_219_PRODUCTION_VERIFIED\`. Its pre-decision observations contain no unique current implementation requirement not preserved by PR #219 receipts and the broader open Security baseline.\n- PR #36 remains open Draft as a historical requirement reference only. Canonical control: \`DO_NOT_REBASE_DO_NOT_MERGE_REBUILD_FROM_CURRENT_MAIN_ONLY\`. Do not force-update, deploy, promote, or apply migrations from that branch. Recover still-approved requirements later in a new isolated branch from then-current \`main\`.\n\n### Repository write-path control\n\n- Direct commits to \`main\` are prohibited for routine code and documentation work.\n- Use an isolated branch and reviewed PR with applicable checks.\n- A direct \`main\` commit is allowed only for a documented emergency where delay creates immediate material harm and the normal PR path is unavailable or unsafe.\n- Any emergency direct commit must record the incident, justification, exact scope, approver, checks performed, rollback method, and follow-up reconciliation PR.\n- Documentation-only urgency or convenience is not an emergency.\n\n### Current stop boundary\n\nDraft PR #220 is documentation-only and may be reviewed for merge separately. No PWA modification/rebase, Supabase/Auth/RLS/data/key/environment mutation, Production Promotion, publishing, messaging, Analytics, Ads, billing, or spend is authorized by this synchronization checkpoint.\n`;

            let h = await read('PROJECT_HANDOFF.md');
            if (!h.text.includes(handoffMarker)) await write('PROJECT_HANDOFF.md', h.text + handoffAppend, h.sha, 'Append canonical truth synchronization to handoff');

            let l = await read('docs/program/STRATEGIC_EXECUTION_LEDGER.md');
            let lt = l.text
              .replace('| GitHub | `aymanmahrous/swim-fluent-uae` | Code and durable-document source of truth; no direct `main` mutation |', '| GitHub | `aymanmahrous/swim-fluent-uae` | Code and durable-document source of truth; branch + reviewed PR required; direct `main` commits only for documented emergencies with rollback and reconciliation |')
              .replace('| 3 | Security, RBAC and Supabase authorization | `REVIEW_READY` | PR #219 Draft; release-gate checks CI #703, Fresh Supabase #31 and Booking Foundation #37 success; owner state `PR_219_TECHNICALLY_APPROVED` | Keep PR #219 Draft and unmerged; require separate Merge gate, then separate Production Migration gate and runtime role-matrix verification |', '| 3 | Security, RBAC and Supabase authorization | `IN_PROGRESS` | PR #219 squash merged at `866327f82f24e1f300aa7cf134b727fd6e0ec9a1`; Production migration `20260730065949_restrict_os_rbac_sanitize_errors` applied; available runtime smoke passed; rollback not required | PR #219 isolated scope is closed; continue broader function-by-function Security Advisor/Auth/RLS review without bulk fixes |')
              .replace('| 4 | PWA installability | `REVIEW_READY_ANDROID_EVIDENCE_UNVERIFIED` | PR #213 Preview/CI green; iPhone PASS; private CacheStorage PASS; same-origin root rollback PASS via PR #217 and CI #694 | Preserve Draft; obtain conclusive Android standalone/offline evidence or explicit risk acceptance before readiness/merge |', '| 4 | PWA installability | `REVIEW_READY` | Device gate conditionally passed as `OWNER_WITNESSED_MANUAL_DEVICE_TEST_PASS`; evidence level `OWNER_ATTESTATION_ONLY_NO_SCREENSHOT_RECEIPT`; documentation risk accepted; PR #213 remains Draft and behind current `main` | Current-main synchronization/rebase decision, fresh CI, exact-head Preview, privacy/offline and rollback re-verification remain pending; no Merge or Production Promotion |');
            const ledgerMarker = '## Checkpoint — 2026-07-30 canonical truth synchronization and stale PR disposition';
            if (!lt.includes(ledgerMarker)) lt += `\n\n\n${ledgerMarker}\n\n- Agent/workstream: Main Project Director / Canonical Governance.\n- Phase and task: \`CANONICAL_TRUTH_SYNCHRONIZATION_AND_STALE_PR_DISPOSITION\`.\n- Status: \`COMPLETED_EVIDENCE_VERIFIED\` for documentation synchronization; PR #220 remains Draft and unmerged.\n- Scope: \`PROJECT_HANDOFF.md\`, this Ledger, baseline receipts, and stale-PR disposition only.\n- Last confirmed result: PR #219's isolated scope is recorded as merged, Production-applied and runtime-verified while broader Security remains open; PWA devices are recorded as owner-attested only with no screenshot/Independent QA claim; PR #218 is closed superseded; PR #36 is formally blocked as rebuild-from-current-main-only.\n- Evidence: PR #219 merge \`866327f82f24e1f300aa7cf134b727fd6e0ec9a1\`; Production migration \`20260730065949_restrict_os_rbac_sanitize_errors\`; receipt \`docs/security/PR_219_PRODUCTION_MIGRATION_RECEIPT_2026-07-30.md\`; PWA receipt on PR #213; PR #218 closed without merge; PR #36 canonical disposition updated.\n- Repository control: routine direct commits to \`main\` are prohibited. Only a documented emergency with immediate material-harm rationale, unavailable/unsafe PR path, approver, checks, rollback and reconciliation may use a direct commit.\n- Failure/recovery: no application or Production failure; no rollback required. Historical stale statements remain preserved as history but are superseded by the latest Handoff and this checkpoint.\n- Protected actions not taken: no Merge, PWA code/rebase, Production Promotion, Supabase/Auth/RLS/data/key/environment mutation, publishing, messaging, Analytics, Ads, billing or spend.\n- Blocker class: PR #220 manager merge decision; PR #213 technical current-main/CI/Preview/rollback gates.\n- Next safe action: review PR #220's documentation-only diff and checks, then decide merge separately. Stop before PWA or Production work.\n- Context health: strong; current operational truth and stale-PR controls are durable.\n`;
            if (lt !== l.text) await write('docs/program/STRATEGIC_EXECUTION_LEDGER.md', lt, l.sha, 'Synchronize strategic execution ledger');

            let sr = await read('docs/program/MASTER_BASELINE_STAGE_RECEIPT_2026-07-30.md');
            if (!sr.text.includes('CANONICAL_TRUTH_SYNCHRONIZED_STALE_PRS_CONTROLLED_REVIEW_READY')) {
              const extra = `\n\n## Authorized follow-on stage completion\n\n- Stage: \`CANONICAL_TRUTH_SYNCHRONIZATION_AND_STALE_PR_DISPOSITION\`.\n- Result: \`CANONICAL_TRUTH_SYNCHRONIZED_STALE_PRS_CONTROLLED_REVIEW_READY\`.\n- Canonical Handoff and Ledger synchronized without replacing historical receipts.\n- PR #218 closed without merge as superseded.\n- PR #36 fixed as \`DO_NOT_REBASE_DO_NOT_MERGE_REBUILD_FROM_CURRENT_MAIN_ONLY\`.\n- Temporary marker removed.\n- No Merge, PWA modification, Supabase/Production mutation or Production Promotion occurred.\n`;
              await write('docs/program/MASTER_BASELINE_STAGE_RECEIPT_2026-07-30.md', sr.text + extra, sr.sha, 'Record canonical synchronization stage completion');
            }

            const syncPath = 'docs/program/CANONICAL_TRUTH_SYNCHRONIZATION_RECEIPT_2026-07-30.md';
            try { await read(syncPath); } catch (e) {
              if (e.status !== 404) throw e;
              const text = `# Canonical Truth Synchronization Receipt\n\nLast verified: 2026-07-30 Asia/Dubai\n\nStatus: \`CANONICAL_TRUTH_SYNCHRONIZED_STALE_PRS_CONTROLLED_REVIEW_READY\`\n\n## Completed\n\n- Preserved and appended \`PROJECT_HANDOFF.md\` with the controlling current-state checkpoint.\n- Updated Phase 3 and Phase 4 current rows in \`docs/program/STRATEGIC_EXECUTION_LEDGER.md\` and appended a durable checkpoint.\n- Recorded PR #219 merge, Production migration, available runtime verification, rollback outcome, and broader Security boundary.\n- Recorded the PWA device gate as owner attestation only, with no screenshot, recording, Independent QA, or automated-device claim.\n- Closed PR #218 without merge as superseded.\n- Fixed PR #36 as \`DO_NOT_REBASE_DO_NOT_MERGE_REBUILD_FROM_CURRENT_MAIN_ONLY\`.\n- Removed the temporary baseline marker.\n- Added the branch/PR-first rule and documented-emergency-only exception for direct commits to \`main\`.\n\n## Explicit exclusions\n\nNo Merge, PWA code/rebase, Production Promotion, Supabase/Auth/RLS/data/key/environment mutation, data/file deletion beyond the explicitly authorized temporary marker, publishing, messaging, Analytics, Ads, billing or spend occurred.\n\n## Review boundary\n\nPR #220 remains Draft. Its merge requires a separate manager decision after final diff and checks review.\n`;
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: syncPath, branch, message: 'Add canonical truth synchronization receipt', content: Buffer.from(text, 'utf8').toString('base64') });
            }

            await remove('.github/workflows/canonical-truth-sync-once.yml', 'Remove one-time synchronization workflow');
            await remove('.github/workflows/canonical-truth-sync-pr.yml', 'Remove PR synchronization workflow');
