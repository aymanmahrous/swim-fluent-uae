name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-context-handoff:
    if: github.event_name == 'pull_request' && github.head_ref == 'governance/context-handoff-protocol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: governance/context-handoff-protocol
          fetch-depth: 0
      - name: Append protocol and restore workflow scope
        shell: bash
        run: |
          set -euo pipefail
          heading="## CONTEXT_LENGTH_AND_NEW_CHAT_PROTOCOL"
          if ! grep -Fqx "$heading" PROJECT_HANDOFF.md; then
            cat >> PROJECT_HANDOFF.md <<'EOF'

## CONTEXT_LENGTH_AND_NEW_CHAT_PROTOCOL

Updated: 2026-07-31 (Asia/Dubai)

Reason: persist the owner-approved context-length, safe new-chat transition, evidence-level, and duplicate-work prevention rules in the official Handoff sources without rewriting earlier project history or changing the approved strategy order.

### Binding context-health rules

1. Every agent must monitor conversation length and context integrity throughout the work.
2. When conversation length may affect accurate recall of decisions, the last confirmed state, completed-versus-remaining work, duplicate-work prevention, Branch/PR/Workflow tracking, or sensitive-command safety, the agent must stop before starting a new task and issue `NEW_CHAT_RECOMMENDED` early.
3. Stating only that the conversation is long is insufficient. The agent must prepare a complete, copy-ready transition Handoff.
4. After `NEW_CHAT_RECOMMENDED`, the agent must not start a new task, merge, perform a Production write, apply a migration, deploy, or create a new PR. Work stops until the owner opens a new chat and pastes the Handoff.
5. The new chat must continue from the last confirmed point and must not restart the project from scratch.
6. Every incoming agent must read `PROJECT_HANDOFF.md`, `PROJECT_STRATEGY_HANDOFF.md`, the mandatory source-of-truth documents, and the execution ledger before proposing or executing work.
7. The warning must be issued before context loss, contradictions, or duplicated execution appear.

### Mandatory transition Handoff template

```text
AGENT_TYPE:
CURRENT_PHASE:
CURRENT_TASK:
TASK_STATUS:
LAST_CONFIRMED_RESULT:
DECISION:
NEXT_REQUIRED_ACTION:
OWNER_ACTION_REQUIRED:
RISK_LEVEL:
PRODUCTION_CHANGED:
COST_OR_SPEND:
WORKSTREAM_OWNER:
ACTIVE_BRANCH:
ACTIVE_PR:
LATEST_BASE_SHA:
LATEST_HEAD_SHA:
LATEST_MERGE_SHA:
OVERLAP_STATUS:
DO_NOT_DO:
CONTEXT_HEALTH: NEW_CHAT_RECOMMENDED

PROJECT:
REPOSITORY:
SOURCE_OF_TRUTH:
APPROVED_STRATEGY_ORDER:
COMPLETED_WORK:
PARTIALLY_COMPLETED_WORK:
CURRENT_ACTIVE_WORK:
EXACT_REMAINING_GAP:
OPEN_PRS_AND_BRANCHES:
MERGED_PRS:
WORKFLOW_RESULTS:
PRODUCTION_STATE:
SUPABASE_STATE:
VERCEL_STATE:
OWNER_APPROVALS_ALREADY_GIVEN:
APPROVALS_STILL_REQUIRED:
PROTECTED_ACTIONS:
FILES_ALREADY_INSPECTED:
EXISTING_IMPLEMENTATION:
DO_NOT_REPEAT:
NEXT_SAFE_TASK:
EXACT_STOP_POINT:
COPYABLE_INSTRUCTION_FOR_NEW_AGENT:
```

### Mandatory duplicate-work prevention record

Every new Handoff and every proposed implementation must explicitly record:

```text
EXISTING_IMPLEMENTATION =
EXISTING_FILES =
EXISTING_PRS =
ALREADY_COMPLETED =
ACTUAL_GAP =
WHY_NEW_WORK_IS_NEEDED =
OVERLAP_CHECK =
```

Agents must not repeat a completed Audit, Inspection, implementation, migration, asset, Branch, or PR merely because the current chat does not contain its history.

### Evidence-level separation

Every claim must be classified using the applicable evidence level:

- `CODE` — present in repository code or documentation only.
- `CI` — verified by an identified automated check on an exact commit.
- `PREVIEW` — observed on a specific non-Production deployment.
- `PRODUCTION` — deployed or applied to the identified Production system and directly verified.
- `OWNER` — explicitly approved or attested by the owner; this does not automatically equal independent QA.
- `QA` — reviewed through the stated human or automated quality method.
- `NOT_LIVE` — planned, documented, contract-tested, Preview-only, merged-but-not-deployed, or otherwise not live.

`CODE MERGED` is never equivalent to `PRODUCTION DEPLOYED`.

A migration committed or merged in Git is never equivalent to a migration applied to Supabase Production. Repository, CI, Preview, Vercel Production, and Supabase Production states must be reported separately.

This protocol is binding for all future agents and supplements the existing Handoff maintenance and phase-persistence rules without changing any earlier owner decision, protected gate, or approved execution order.
EOF
          fi
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/context-handoff-append.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_HANDOFF.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No finalization change required."
            exit 0
          fi
          git commit -m "docs(governance): persist context and new-chat protocol"
          git push origin HEAD:governance/context-handoff-protocol

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Typecheck
        run: npm run typecheck > typecheck.log 2>&1 || { cat typecheck.log; exit 1; }
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Verify audited staff RBAC matrix
        run: npm run test:rbac
      - name: Verify public and internal route boundary
        run: node scripts/verify-public-internal-boundary.mjs
      - name: Verify module ownership boundaries
        run: node scripts/verify-module-ownership-boundaries.mjs
      - name: Verify Architecture and AI data boundaries
        run: node scripts/verify-architecture-ai-boundaries.mjs
      - name: Verify browser, server, and bundle boundaries
        run: node scripts/verify-quality-bundle-boundaries.mjs > quality-bundle-boundaries.log 2>&1 || { cat quality-bundle-boundaries.log; exit 1; }
      - name: Upload quality and bundle diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-bundle-boundary-diagnostics
          path: quality-bundle-boundaries.log
          if-no-files-found: ignore
      - name: Verify dependency and workflow supply-chain boundaries
        run: node scripts/verify-dependency-supply-chain.mjs
      - name: Verify final Production readiness source boundaries
        run: node scripts/verify-production-readiness.mjs
      - name: Verify privileged API authentication boundaries
        run: node scripts/verify-privileged-api-auth-boundaries.mjs
      - name: Verify Staff mutation RBAC boundaries
        run: node scripts/verify-staff-mutation-rbac.mjs
      - name: Verify API mutation input contracts
        run: node scripts/verify-api-mutation-input-contracts.mjs > mutation-input-contract.log 2>&1 || { cat mutation-input-contract.log; exit 1; }
      - name: Upload mutation input diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-input-contract-diagnostics
          path: mutation-input-contract.log
          if-no-files-found: ignore
      - name: Verify authentication, booking, recovery, and AI abuse-control boundaries
        run: node scripts/verify-abuse-control-boundaries.mjs
      - name: Verify browser headers, sessions, CSRF, and secret boundaries
        run: node scripts/verify-security-hardening-wave-1.mjs
      - name: Verify API inventory, media, errors, and logging boundaries
        run: node scripts/verify-attack-surface-wave-2.mjs
      - name: Verify legacy repository and deployment parity hold gate
        run: node scripts/verify-legacy-repository-parity-gate.mjs
      - run: npm run lint
      - run: npm run build
      - name: Parse Production workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "parsed #{file}" }' \
            .github/workflows/ai-media-e2e.yml \
            .github/workflows/ai-media-current-production-e2e.yml \
            .github/workflows/ai-media-live-fallback.yml \
            .github/workflows/production-booking-smoke.yml \
            .github/workflows/production-smoke-readonly.yml
      - name: Verify public SEO, localization, and indexing boundaries
        run: npm run verify:public-seo
      - name: Verify production sitemap route and canonical URL set
        run: npm run verify:production-sitemap
      - name: Verify Production Quality Gate remains scheduled and read-only
        run: node scripts/verify-production-quality-gate.mjs
      - name: Verify public Arabic and English free-claim removal
        run: npm run verify:public-free-claims
      - name: Verify bilingual Chatbot Phase 1
        run: npm run verify:chatbot-phase1
      - name: Verify Content Brain cadence and fatigue boundaries
        run: npm run verify:content-brain
      - name: Verify Meta publishing receipts and Planner schedule suggestions
        run: npm run verify:meta-publishing
      - name: Verify autonomous content media worker contracts
        run: npm run verify:content-media-worker
      - name: Verify server-side content automation scheduler
        run: npm run verify:content-automation-scheduler
      - name: Verify modern and legacy Supabase server-key compatibility
        run: npm run verify:supabase-server-key
      - name: Verify password recovery flow contracts
        run: npm run verify:password-recovery
      - name: Verify privacy-safe PWA installability
        run: |
          node --check public/service-worker.js
          npm run verify:pwa-installability
      - name: Verify Vercel automated preview build policy
        run: node scripts/verify-vercel-build-policy.mjs
      - name: Verify AI OS security and real-data contracts
        run: node scripts/verify-ai-os-contracts.mjs
      - name: Verify AI media ownership and private storage contracts
        run: node scripts/verify-ai-media-hardening.mjs
      - name: Verify AI media E2E admin contracts
        run: node scripts/verify-ai-media-e2e-admin-contracts.mjs
      - name: Verify Production-writing workflows remain manual-only
        run: node scripts/verify-production-workflows-manual-only.mjs
      - name: Verify Supabase booking settings without writes
        run: node scripts/verify-supabase-booking-readonly.mjs
