name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handoff-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/restrict-os-rbac-sanitize-errors-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/restrict-os-rbac-sanitize-errors-20260730
          fetch-depth: 0
      - name: Synchronize durable release records
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = "PR_219_RELEASE_GATE_CHECKS_PASS"
          handoff = Path("PROJECT_HANDOFF.md")
          ledger = Path("docs/program/STRATEGIC_EXECUTION_LEDGER.md")
          h = handoff.read_text().replace("Last verified: 2026-07-29 (Asia/Dubai)", "Last verified: 2026-07-30 (Asia/Dubai)", 1)
          if marker not in h:
              h += """


## 28. PR #219 release-gate readiness — 2026-07-30

Status: `PR_219_RELEASE_GATE_CHECKS_PASS`

- Owner technical approval: `PR_219_TECHNICALLY_APPROVED` for the current isolated scope only.
- Draft PR #219 remains open, Draft, mergeable, and unmerged.
- Branch `agent/restrict-os-rbac-sanitize-errors-20260730` was verified against latest `main` at `2f526ca16cf9cdaf2ab410cb3ae0ba8118f6f3bc`: ahead only and `behind_by=0`; no new conflict was observed.
- Approved behavior: remove `content_manager` from `get_staff_command_center()` and `get_staff_operations_queue()`; retain `super_admin`, `admin`, `reception`, and temporary `coach`; return `JOB_FAILED` instead of raw `last_error` to `coach`.
- Release-gate evidence on documentation-plan head `b7499c15bd7439a20b2fd865ca62492d962493b0`: CI #703 success; Fresh Supabase Migration Compatibility #31 success; Booking Phone Foundation #37 success.
- Merge and Production migration remain separate protected gates. No merge occurred and migration `20260729221600_restrict_os_rbac_sanitize_errors.sql` has not been applied to Production.
- Release and rollback plan: `docs/security/PR_219_MERGE_AND_PRODUCTION_RELEASE_GATE_PLAN_2026-07-30.md`.
- Required post-Production runtime matrix: `super_admin`, `admin`, and `reception` receive successful command-center/operations responses and privileged raw operational error where applicable; `coach` receives successful responses but only sanitized `JOB_FAILED`; `content_manager` receives `STAFF_ACCESS_DENIED`; anonymous execution remains denied.
- Rollback, if the separately approved Production migration causes authorization or response-shape regression: restore the prior two function definitions and role allowlists in a new explicit rollback migration, verify grants/search paths and role matrix read-only, and record receipts. Do not rewrite migration history or mutate data.
- No Supabase Production, Auth, RLS, data, key, environment, Production deployment, publishing, Analytics, Ads, billing, or spend mutation occurred in this readiness stage.

### Next protected gates

1. Separate explicit Merge authorization for PR #219.
2. After merge evidence is recorded, separate explicit Production Migration authorization.
"""
          handoff.write_text(h)
          l = ledger.read_text().replace("Last verified: 2026-07-29 (Asia/Dubai)", "Last verified: 2026-07-30 (Asia/Dubai)", 1)
          old = "| 3 | Security, RBAC and Supabase authorization | `IN_PROGRESS` | PR #210 merged at `bf460fe8b25d8b3fd35a862694cc00b07545b9bf`; CI #679 and Fresh Supabase #26 success; exact 23 authenticated privileged contracts now fail CI on ACL/guard/search-path/RLS drift | Preserve closed booking and anon invariants; decide command-center/queue and coach least privilege in isolated compatibility work |"
          new = "| 3 | Security, RBAC and Supabase authorization | `REVIEW_READY` | PR #219 Draft; release-gate checks CI #703, Fresh Supabase #31 and Booking Foundation #37 success; owner state `PR_219_TECHNICALLY_APPROVED` | Keep PR #219 Draft and unmerged; require separate Merge gate, then separate Production Migration gate and runtime role-matrix verification |"
          l = l.replace(old, new, 1)
          if marker not in l:
              l += """


## Checkpoint — 2026-07-30 PR #219 release-gate readiness

- Agent/workstream: Main Project Director / Supabase Security and OS RBAC.
- Phase and task: Phase 3 — finalize merge readiness for the approved `REMOVE_CONTENT_MANAGER_KEEP_COACH_TEMPORARILY_SANITIZE_OPERATIONAL_ERRORS` change.
- Status: `REVIEW_READY`; durable state `PR_219_RELEASE_GATE_CHECKS_PASS`.
- Scope: release planning and durable documentation for PR #219 only.
- Explicit exclusions: no merge, Production migration, Supabase Production mutation, Auth, RLS, data, keys, Production deployment, publishing, messaging, Analytics, Ads, billing or spend.
- Last confirmed result: PR #219 is Draft, open, mergeable and unmerged; its branch is behind latest `main` by zero commits. The Production migration has not been executed.
- Evidence: PR #219; CI #703 success; Fresh Supabase Migration Compatibility #31 success; Booking Phone Foundation #37 success; release/rollback plan `docs/security/PR_219_MERGE_AND_PRODUCTION_RELEASE_GATE_PLAN_2026-07-30.md`.
- Runtime matrix after a separately approved Production migration: allow `super_admin`, `admin`, `reception`, and temporary `coach`; deny `content_manager`; sanitize coach background-job errors to `JOB_FAILED`; retain raw operational detail only for the other allowed privileged roles; keep anonymous execution denied.
- Rollback: apply a new explicit rollback migration restoring prior function definitions and role allowlists, then run read-only grants, search-path, response-shape and per-role verification. Never rewrite migration history and never mutate application data as rollback.
- Failure/recovery: initial implementation CI failures were limited to migration inventory, SQL verifier quoting and Phase A scenario isolation; each was corrected inside PR #219 and the final required matrix passed.
- Protected actions not taken: every Production and merge action remains untouched.
- Blocker class: separate owner Merge authorization, followed by a separate owner Production Migration authorization.
- Next safe action: stop before Merge and present final readiness evidence.
- Context health: strong; implementation, tests, release order, rollback and protected boundaries are durable.
"""
          ledger.write_text(l)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_HANDOFF.md docs/program/STRATEGIC_EXECUTION_LEDGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PR 219 release gate readiness"
          git push origin HEAD:agent/restrict-os-rbac-sanitize-errors-20260730

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Typecheck
        run: npm run typecheck > typecheck.log 2>&1 || { cat typecheck.log; exit 1; }
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Verify audited staff RBAC matrix
        run: npm run test:rbac
      - name: Verify public and internal route boundary
        run: node scripts/verify-public-internal-boundary.mjs
      - name: Verify module ownership boundaries
        run: node scripts/verify-module-ownership-boundaries.mjs
      - name: Verify Architecture and AI data boundaries
        run: node scripts/verify-architecture-ai-boundaries.mjs
      - name: Verify browser, server, and bundle boundaries
        run: node scripts/verify-quality-bundle-boundaries.mjs > quality-bundle-boundaries.log 2>&1 || { cat quality-bundle-boundaries.log; exit 1; }
      - name: Upload quality and bundle diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-bundle-boundary-diagnostics
          path: quality-bundle-boundaries.log
          if-no-files-found: ignore
      - name: Verify dependency and workflow supply-chain boundaries
        run: node scripts/verify-dependency-supply-chain.mjs
      - name: Verify final Production readiness source boundaries
        run: node scripts/verify-production-readiness.mjs
      - name: Verify privileged API authentication boundaries
        run: node scripts/verify-privileged-api-auth-boundaries.mjs
      - name: Verify Staff mutation RBAC boundaries
        run: node scripts/verify-staff-mutation-rbac.mjs
      - name: Verify API mutation input contracts
        run: node scripts/verify-api-mutation-input-contracts.mjs > mutation-input-contract.log 2>&1 || { cat mutation-input-contract.log; exit 1; }
      - name: Upload mutation input diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-input-contract-diagnostics
          path: mutation-input-contract.log
          if-no-files-found: ignore
      - name: Verify authentication, booking, recovery, and AI abuse-control boundaries
        run: node scripts/verify-abuse-control-boundaries.mjs
      - name: Verify browser headers, sessions, CSRF, and secret boundaries
        run: node scripts/verify-security-hardening-wave-1.mjs
      - name: Verify API inventory, media, errors, and logging boundaries
        run: node scripts/verify-attack-surface-wave-2.mjs
      - name: Verify legacy repository and deployment parity hold gate
        run: node scripts/verify-legacy-repository-parity-gate.mjs
      - run: npm run lint
      - run: npm run build
      - name: Parse Production workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "parsed #{file}" }' \
            .github/workflows/ai-media-e2e.yml \
            .github/workflows/ai-media-current-production-e2e.yml \
            .github/workflows/ai-media-live-fallback.yml \
            .github/workflows/production-booking-smoke.yml \
            .github/workflows/production-smoke-readonly.yml
      - name: Verify public SEO, localization, and indexing boundaries
        run: npm run verify:public-seo
      - name: Verify production sitemap route and canonical URL set
        run: npm run verify:production-sitemap
      - name: Verify Production Quality Gate remains scheduled and read-only
        run: node scripts/verify-production-quality-gate.mjs
      - name: Verify public Arabic and English free-claim removal
        run: npm run verify:public-free-claims
      - name: Verify bilingual Chatbot Phase 1
        run: npm run verify:chatbot-phase1
      - name: Verify Content Brain cadence and fatigue boundaries
        run: npm run verify:content-brain
      - name: Verify Meta publishing receipts and Planner schedule suggestions
        run: npm run verify:meta-publishing
      - name: Verify autonomous content media worker contracts
        run: npm run verify:content-media-worker
      - name: Verify server-side content automation scheduler
        run: npm run verify:content-automation-scheduler
      - name: Verify modern and legacy Supabase server-key compatibility
        run: npm run verify:supabase-server-key
      - name: Verify password recovery flow contracts
        run: npm run verify:password-recovery
      - name: Verify Vercel automated preview build policy
        run: node scripts/verify-vercel-build-policy.mjs
      - name: Verify AI OS security and real-data contracts
        run: node scripts/verify-ai-os-contracts.mjs
      - name: Verify AI media ownership and private storage contracts
        run: node scripts/verify-ai-media-hardening.mjs
      - name: Verify AI media E2E admin contracts
        run: node scripts/verify-ai-media-e2e-admin-contracts.mjs
      - name: Verify Production-writing workflows remain manual-only
        run: node scripts/verify-production-workflows-manual-only.mjs
      - name: Verify Supabase booking settings without writes
        run: node scripts/verify-supabase-booking-readonly.mjs
