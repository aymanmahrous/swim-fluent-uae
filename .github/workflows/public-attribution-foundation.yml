name: Public Attribution Foundation

on:
  pull_request:
    paths:
      - "src/platform/public-attribution.ts"
      - "scripts/verify-public-attribution-foundation.mjs"
      - ".github/workflows/public-attribution-foundation.yml"
  push:
    branches: [main]
    paths:
      - "src/platform/public-attribution.ts"
      - "scripts/verify-public-attribution-foundation.mjs"
      - ".github/workflows/public-attribution-foundation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify privacy-safe UTM attribution foundation
        run: node scripts/verify-public-attribution-foundation.mjs
